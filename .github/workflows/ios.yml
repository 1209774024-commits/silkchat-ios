# 云端编译苹果安装包。
#
# 为什么要云端编：苹果的 App**只能**用苹果电脑上的 Xcode 来编，开发机是 Windows，
# 本机做不了。GitHub 免费提供 macOS 机器，所以借它来编，编完把安装包作为"产物"
# 挂出来下载。免费额度足够 —— 一次编译约 3~5 分钟，私有仓库每月 2000 分钟。
#
# 产出的 ipa 是**未签名**的：签名留到装机那一步，用装机人自己的苹果账号现签现装。
# 这样这台云端机器不需要、也拿不到任何证书或密码。
#
# 触发方式：网页上点 Actions → 左侧 Build iOS IPA → 右侧 Run workflow。

name: Build iOS IPA

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen（把 project.yml 变成 Xcode 工程）
        run: brew install xcodegen

      - name: 检查 App 图标
        run: |
          # 图标是 tools/make-icon.py 用脚本画出来的，1024x1024、方形、不带圆角、不带透明，
          # 已经跟工程一起提交在仓库里。这里只做检查，不做放大。
          #
          # 以前这里是用 sips 把网页版那张 512 放大成 1024 —— 那是错的：
          # 放大出来的图是糊的，而且原图自带了圆角和留白，苹果再套一层圆角，
          # 图案会变小一圈。这个坑记在这儿，别再改回去。
          cd ios/SilkChat/Assets.xcassets/AppIcon.appiconset
          ls -la
          for f in icon-1024.png icon-1024-dark.png icon-1024-tinted.png; do
            test -f "$f" || { echo "缺少图标 $f"; exit 1; }
            wh=$(sips -g pixelWidth -g pixelHeight "$f" | tr -d ' \n')
            echo "$f -> $wh"
            case "$wh" in
              *pixelWidth:1024*pixelHeight:1024*) ;;
              *) echo "图标 $f 不是 1024x1024"; exit 1 ;;
            esac
          done

      - name: 生成 Xcode 工程
        run: |
          cd ios
          xcodegen generate

      - name: 编译（不签名）
        run: |
          cd ios
          xcodebuild \
            -project SilkChat.xcodeproj \
            -scheme SilkChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./dd \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          find ./dd/Build/Products -maxdepth 3 -name "SilkChat.app" | head -1

      - name: 打包成 ipa
        run: |
          cd ios
          APP=$(find ./dd/Build/Products -maxdepth 3 -name "SilkChat.app" | head -1)
          if [ -z "$APP" ]; then echo "!! 没编出 SilkChat.app"; exit 1; fi
          echo "产物: $APP"
          rm -rf Payload SilkChat-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SilkChat-unsigned.ipa Payload
          ls -la SilkChat-unsigned.ipa

      - name: 挂出安装包供下载
        uses: actions/upload-artifact@v4
        with:
          name: SilkChat-ipa
          path: ios/SilkChat-unsigned.ipa
          retention-days: 30
